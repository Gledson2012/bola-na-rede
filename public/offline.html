<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Sem conexão • Bola na Rede</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --card: #0f172a;
        --border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #0284c7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 24px;
      }
      .ball {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: rgba(2, 132, 199, 0.15);
        font-size: 36px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ball" aria-hidden="true">⚽</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível alcançar o Bola na Rede. Verifique o Wi-Fi ou os dados
        móveis e tente novamente.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
